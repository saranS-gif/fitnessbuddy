<!-- Firebase Auth Modal Component -->
<div id="auth-modal" class="auth-modal-overlay">
  <div class="auth-modal-card">
    <button class="auth-close-btn" onclick="document.getElementById('auth-modal').style.display='none'">&times;</button>
    
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 2rem;">⚡</span>
      <h2 id="auth-title" style="color: var(--navy); font-size: 1.5rem; margin-top: 0.25rem;">Sign In to FitBuddy</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Save your workout plans and access them on any device.</p>
    </div>

    <!-- Google Sign In -->
    <button type="button" class="btn-google" onclick="window.FitBuddyFirebase && window.FitBuddyFirebase.signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or continue with email</span></div>

    <!-- Email / Password Form -->
    <form id="auth-email-form" onsubmit="handleEmailAuth(event)">
      <div class="form-group" style="margin-bottom: 0.75rem;">
        <input type="email" id="auth-email" class="form-control" placeholder="Email address" required>
      </div>
      <div class="form-group" style="margin-bottom: 1rem;">
        <input type="password" id="auth-password" class="form-control" placeholder="Password (min. 6 characters)" minlength="6" required>
      </div>
      <button type="submit" id="btn-auth-submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
      <span id="auth-toggle-prompt">Don't have an account?</span>
      <a href="javascript:void(0)" onclick="toggleAuthMode()" id="auth-toggle-link" style="color: var(--primary-dark); font-weight: 600; margin-left: 0.25rem;">
        Create account
      </a>
    </div>
  </div>
</div>

<script>
  let isSignUpMode = false;
  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById("auth-title").textContent = isSignUpMode ? "Create an Account" : "Sign In to FitBuddy";
    document.getElementById("btn-auth-submit").textContent = isSignUpMode ? "Create Account" : "Sign In";
    document.getElementById("auth-toggle-prompt").textContent = isSignUpMode ? "Already have an account?" : "Don't have an account?";
    document.getElementById("auth-toggle-link").textContent = isSignUpMode ? "Sign In" : "Create account";
  }

  async function handleEmailAuth(event) {
    event.preventDefault();
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    if (!email || !password) return;

    const btn = document.getElementById("btn-auth-submit");
    const origText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = "Processing...";
    try {
      if (isSignUpMode) {
        await window.FitBuddyFirebase.registerEmail(email, password);
      } else {
        await window.FitBuddyFirebase.loginEmail(email, password);
      }
    } catch (e) {
      // Toast handles display
    } finally {
      btn.disabled = false;
      btn.innerHTML = isSignUpMode ? "Create Account" : "Sign In";
    }
  }
</script>
<script type="module" src="/static/js/firebase.js"></script>
