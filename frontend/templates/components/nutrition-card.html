<div class="card meal-card">
  <div>
    <h4>{{ meal.meal }}</h4>
    <p style="color: var(--text-muted); font-size: 0.85rem;">{{ meal.recommendation }}</p>
  </div>
  <div style="text-align: right;">
    <span style="font-weight: 700; color: var(--accent-primary);">{{ meal.calories }}</span>
    <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">KCAL</span>
  </div>
</div>
