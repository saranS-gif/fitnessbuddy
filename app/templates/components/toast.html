<div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;">
  <!-- Dynamic toasts render here -->
</div>
<style>
.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 0.75rem 1.25rem;
  border-radius: var(--radius-sm);
  color: var(--text-main);
  box-shadow: var(--shadow-card);
  animation: slideIn 0.3s ease;
}
.toast-success { border-left: 4px solid var(--accent-primary); }
.toast-error { border-left: 4px solid var(--accent-danger); }
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
</style>
