<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating Your Plan... | FitBuddy AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="/" class="brand">⚡ FitBuddy <span class="brand-badge">AI COACH</span></a>
  </header>

  <main class="container-sm" style="margin-top: 5rem;">
    <div class="card loading-box">
      <div class="spinner"></div>
      <h2 style="color: var(--navy); margin-bottom: 0.5rem;">AI is creating your personalized plan...</h2>
      <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 1.5rem;">
        Google Gemini is calibrating your training splits, sets, repetitions, and recovery guide. This usually takes 3 to 6 seconds.
      </p>
      <div style="font-size: 0.85rem; color: var(--text-light);">
        Please keep this window open...
      </div>
    </div>
  </main>

  <script src="/static/js/app.js"></script>
  <script>
    // Auto redirect to dashboard after verifying storage
    setTimeout(() => {
      window.location.href = "/dashboard";
    }, 4000);
  </script>
</body>
</html>
